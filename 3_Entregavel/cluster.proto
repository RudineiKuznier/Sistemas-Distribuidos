syntax = "proto3";

package cluster;

service NodeService {
    // RPCs Internos (Nó para Nó)
    rpc RequestVote (VoteRequest) returns (VoteResponse);
    rpc Fetch (FetchRequest) returns (FetchResponse);
    
    // RPC Externo (Cliente para Nó)
    rpc ClientRequest (ClientRequestMsg) returns (ClientResponseMsg);
}

message VoteRequest {
    int32 term = 1;
    string candidate_id = 2;
    int32 last_log_index = 3;
    int32 last_log_term = 4;
}

message VoteResponse {
    int32 term = 1;
    bool vote_granted = 2;
}

message LogEntry {
    int32 term = 1;
    int32 index = 2;
    string command = 3;
}

message FetchRequest {
    int32 term = 1;
    string follower_id = 2;
    int32 last_log_index = 3;
    int32 last_log_term = 4;
}

message FetchResponse {
    int32 term = 1;
    bool success = 2;
    int32 conflict_index = 3;
    repeated LogEntry entries = 4;
    int32 commit_index = 5;
    string leader_id = 6;
}

message ClientRequestMsg {
    string operation = 1; // PUT, GET, PING
    string key = 2;
    string value = 3;
}

message ClientResponseMsg {
    bool success = 1;
    string leader_id = 2;
    string value = 3;
    string message = 4;
}